<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Archunan Anand — Software Engineer</title>
  <link rel="icon" href="my-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ═══ TOKENS ═══ */
    :root {
      --bg:         oklch(10%   0.008 30);
      --bg-soft:    oklch(14%   0.009 30);
      --surface:    oklch(16.5% 0.010 28);
      --border:     oklch(22%   0.008 28);
      --text:       oklch(92%   0.007 65);
      --muted:      oklch(56%   0.008 55);
      --faint:      oklch(36%   0.007 40);
      --accent:     oklch(62%   0.180 22);
      --accent-h:   oklch(66%   0.180 22);
      --accent-dim: oklch(62%   0.180 22 / 0.13);
      --fd: 'Syne', system-ui, sans-serif;
      --fb: 'Space Grotesk', system-ui, sans-serif;
      --fm: 'Space Mono', monospace;
      --mw: 1120px;
      --sg: 116px;
      --t:  0.2s ease;
    }
    [data-theme="light"] {
      --bg:         oklch(97%   0.005 65);
      --bg-soft:    oklch(93%   0.007 60);
      --surface:    oklch(88%   0.009 58);
      --border:     oklch(80%   0.007 55);
      --text:       oklch(13%   0.008 30);
      --muted:      oklch(42%   0.008 35);
      --faint:      oklch(62%   0.007 35);
      --accent-dim: oklch(62%   0.180 22 / 0.09);
    }

    /* ═══ RESET ═══ */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--fb); line-height: 1.65;
      overflow-x: hidden;
      transition: background var(--t), color var(--t);
    }
    img { display:block; max-width:100%; }
    a   { color:inherit; text-decoration:none; }
    button { font-family: var(--fb); cursor:pointer; border:none; background:none; }

    /* ═══ LAYOUT ═══ */
    .container { max-width: var(--mw); margin:0 auto; padding:0 52px; }
    .section   { padding: var(--sg) 0; }


    .sec-heading {
      font-family: var(--fd);
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 600; line-height: 1.08; letter-spacing: -0.01em;
      margin-bottom: 52px;
    }

    /* ═══ REVEAL ═══ */
    .reveal { opacity:0; transform:translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.in { opacity:1; transform:translateY(0); }
    .d1 { transition-delay: 0.08s; }
    .d2 { transition-delay: 0.16s; }
    .d3 { transition-delay: 0.24s; }

    /* ═══ NAV ═══ */
    .scroll-bar {
      position:fixed; top:0; left:0; height:2px;
      background: var(--accent); z-index:101;
      transition: width 0.08s linear; pointer-events:none;
    }
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding: 22px 52px;
      border-bottom: 1px solid transparent;
      transition: padding var(--t), background var(--t), border-color var(--t);
    }
    nav.scrolled { background:var(--bg); border-color:var(--border); padding:14px 52px; }
    .nav-logo { font-family:var(--fd); font-size:18px; font-weight:700; letter-spacing:-0.01em; }
    .nav-links { display:flex; align-items:center; gap:32px; list-style:none; }
    .nav-links a { font-size:13px; color:var(--muted); transition:color var(--t); }
    .nav-links a:hover  { color:var(--text); }
    .nav-links a.active { color:var(--accent); }
    .nav-resume {
      font-family: var(--fm); font-size:10.5px; letter-spacing:0.1em;
      text-transform: uppercase; color: var(--accent) !important;
      border: 1px solid oklch(62% 0.18 22 / 0.5);
      padding: 7px 16px; border-radius: 5px; white-space: nowrap;
      transition: background var(--t), border-color var(--t) !important;
    }
    .nav-resume:hover { background:var(--accent-dim); border-color:var(--accent) !important; color:var(--accent) !important; }

    /* ═══ HERO ═══ */
    #hero {
      min-height: 100vh; display:flex; align-items:center;
      overflow:hidden; padding-top:80px; position:relative;
    }
    /* subtle side gradient */
    #hero::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse 60% 80% at 80% 50%, oklch(62% 0.18 22 / 0.04) 0%, transparent 70%);
      pointer-events:none;
    }
    .hero-inner {
      display:grid; grid-template-columns:1fr 320px;
      gap:80px; align-items:center; width:100%; position:relative; z-index:1;
    }
    .hero-label {
      font-family: var(--fm); font-size:10.5px; letter-spacing:0.2em;
      text-transform:uppercase; color:var(--accent);
      margin-bottom:22px;
      animation: rise 0.65s ease 0.1s both;
    }
    .hero-name {
      font-family: var(--fd); font-weight:700;
      font-size: clamp(50px, 7.2vw, 96px);
      line-height: 0.93; letter-spacing:-0.018em;
      margin-bottom:28px;
      animation: rise 0.65s ease 0.2s both;
    }
    .hero-tagline {
      font-size:15.5px; font-weight:300; color:var(--muted);
      max-width:480px; line-height:1.72; margin-bottom:0;
      animation: rise 0.65s ease 0.38s both;
    }

    /* Hero link bar */
    .hero-linkbar {
      display:flex; margin-top:36px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      animation: rise 0.65s ease 0.5s both;
    }
    .hero-lnk {
      display:inline-flex; align-items:center; gap:6px;
      font-family:var(--fm); font-size:10.5px; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--muted);
      padding:13px 20px;
      border-right: 1px solid var(--border);
      transition: color var(--t), background var(--t);
    }
    .hero-lnk:first-child { padding-left:0; }
    .hero-lnk:last-child  { border-right:none; }
    .hero-lnk:hover       { color:var(--text); }
    .hero-lnk.hi          { color:var(--accent); }
    .hero-lnk.hi:hover    { background:var(--accent-dim); }



    /* Photo */
    .hero-photo-side {
      display:flex; flex-direction:column; align-items:center;
      gap:20px;
      animation: rise 0.65s ease 0.28s both;
    }
    .hero-img {
      width:300px; height:300px; border-radius:50%;
      object-fit:cover; object-position:center 15%;
      border: 1px solid var(--border);
    }
    .hero-avail {
      display:flex; align-items:center; gap:8px;
      font-family:var(--fm); font-size:10px; letter-spacing:0.12em;
      text-transform:uppercase; color:var(--faint);
    }
    .avail-dot {
      width:7px; height:7px; border-radius:50%; background:#4ade80;
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes rise { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes glow { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ═══ EXPERIENCE ═══ */
    .exp-list { display:flex; flex-direction:column; }
    .exp-entry {
      padding:44px 0;
      border-bottom: 1px solid var(--border);
    }
    .exp-entry:first-child { border-top:1px solid var(--border); }
    .exp-top {
      display:flex; justify-content:space-between; align-items:flex-start;
      margin-bottom:18px; gap:16px;
    }
    .exp-co {
      font-family:var(--fd); font-size:21px; font-weight:700;
      letter-spacing:-0.02em; margin-bottom:4px;
    }
    .exp-role { font-size:13.5px; color:var(--muted); }
    .exp-period {
      font-family:var(--fm); font-size:10.5px;
      color:var(--faint); white-space:nowrap; letter-spacing:0.07em;
      padding-top:4px;
    }
    .exp-prose {
      font-size:15px; color:var(--muted);
      line-height:1.75; margin-bottom:20px;
      max-width:720px; text-wrap:pretty;
    }

    /* ═══ TAGS ═══ */
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag {
      font-family:var(--fm); font-size:10px; letter-spacing:0.04em;
      color:var(--muted); background:var(--surface);
      border:1px solid var(--border);
      padding:4px 10px; border-radius:4px;
    }
    .tag-a {
      color:var(--accent);
      border-color:oklch(62% 0.18 22 / 0.32);
      background:var(--accent-dim);
    }
    /* Dark mode: all chips accent-colored */
    [data-theme="dark"] .tag {
      color:var(--accent);
      border-color:oklch(62% 0.18 22 / 0.32);
      background:var(--accent-dim);
    }
    /* Light mode: tag-a chips match neutral style */
    [data-theme="light"] .tag-a {
      color:var(--muted);
      border-color:var(--border);
      background:var(--surface);
    }

    /* ═══ PROJECTS ═══ */
    .proj-list { display:flex; flex-direction:column; }
    .proj-entry {
      padding:44px 0;
      border-bottom: 1px solid var(--border);
      display:grid; grid-template-columns:1fr auto;
      gap:52px; align-items:start;
    }
    .proj-entry:first-child { border-top:1px solid var(--border); }
    .proj-name {
      font-family:var(--fd); font-size:clamp(22px, 2.6vw, 34px);
      font-weight:700; letter-spacing:-0.025em; margin-bottom:6px;
    }
    .proj-sub  { font-size:13.5px; color:var(--muted); margin-bottom:18px; }
    .proj-desc {
      font-size:15px; color:var(--muted); line-height:1.75;
      margin-bottom:20px; max-width:660px; text-wrap:pretty;
    }
    .proj-link {
      display:inline-flex; align-items:center; gap:8px;
      font-family:var(--fm); font-size:10.5px; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--accent);
      border:1px solid oklch(62% 0.18 22 / 0.45);
      padding:10px 20px; border-radius:6px; white-space:nowrap;
      transition: background var(--t), border-color var(--t);
      margin-top:6px;
    }
    .proj-link:hover { background:var(--accent-dim); border-color:var(--accent); }

    /* ═══ SKILLS ═══ */
    .skill-table { display:flex; flex-direction:column; }
    .skill-row {
      display:grid; grid-template-columns:136px 1fr;
      gap:24px; align-items:start;
      padding:18px 0;
      border-bottom: 1px solid var(--border);
    }
    .skill-row:first-child { border-top:1px solid var(--border); }
    .skill-cat {
      font-family:var(--fm); font-size:10px; color:var(--faint);
      text-transform:uppercase; letter-spacing:0.14em; padding-top:5px;
    }

    /* ═══ CONTACT ═══ */
    #contact { padding: var(--sg) 0 calc(var(--sg) * 0.5); }
    .contact-hed {
      font-family:var(--fd);
      font-size:clamp(32px, 4.5vw, 60px);
      font-weight:600; line-height:1.1; letter-spacing:-0.005em;
      margin-bottom:18px;
    }
    .contact-sub {
      font-size:15px; color:var(--muted);
      max-width:400px; line-height:1.7; margin-bottom:44px;
    }
    .contact-row {
      display:flex; gap:0; flex-wrap:wrap;
    }
    .clink {
      display:inline-flex; align-items:center; gap:6px;
      font-family:var(--fm); font-size:10.5px; letter-spacing:0.08em;
      text-transform:uppercase; color:var(--muted);
      padding:13px 22px;
      border:1px solid var(--border); border-right:none;
      transition: color var(--t), background var(--t);
    }
    .clink:first-child { border-radius:7px 0 0 7px; }
    .clink:last-child  { border-right:1px solid var(--border); border-radius:0 7px 7px 0; }
    .clink:hover       { color:var(--text); background:var(--bg-soft); }
    .clink.p {
      background:var(--accent); border-color:var(--accent); color:#fff;
    }
    .clink.p:hover { background:var(--accent-h); border-color:var(--accent-h); }

    /* ═══ FOOTER ═══ */
    footer { border-top:1px solid var(--border); padding:28px 0; margin-top:64px; }
    footer .container { display:flex; justify-content:space-between; align-items:center; }
    .ft { font-family:var(--fm); font-size:10.5px; color:var(--faint); letter-spacing:0.08em; }

    /* ═══ TWEAKS ═══ */
    .tp {
      position:fixed; bottom:24px; right:24px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; padding:20px; width:252px; z-index:200;
      box-shadow:0 20px 60px rgba(0,0,0,0.4); display:none;
    }
    .tp.on { display:block; }
    .tp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .tp-title { font-family:var(--fm); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--faint); }
    .tp-x { cursor:pointer; color:var(--faint); font-size:13px; transition:color var(--t); }
    .tp-x:hover { color:var(--text); }
    .tp-row { margin-bottom:14px; }
    .tp-lbl { font-size:11.5px; font-weight:500; color:var(--muted); margin-bottom:7px; }
    .tp-opts { display:flex; gap:7px; }
    .tp-btn {
      flex:1; font-family:var(--fm); font-size:10px; letter-spacing:0.06em;
      padding:7px; border-radius:5px;
      border:1px solid var(--border); background:var(--bg-soft);
      color:var(--muted); cursor:pointer;
      transition:all var(--t); text-align:center;
    }
    .tp-btn.on { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
    .tp-btn:hover:not(.on) { border-color:var(--faint); color:var(--text); }
    .swatch {
      width:24px; height:24px; border-radius:50%; cursor:pointer;
      border:2px solid transparent; transition:border-color var(--t), transform var(--t);
    }
    .swatch.on    { border-color:var(--text); }
    .swatch:hover { transform:scale(1.12); }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 960px) {
      .container { padding:0 28px; }
      nav, nav.scrolled { padding:14px 28px; }
      .hero-inner { grid-template-columns:1fr; gap:44px; }
      .hero-photo-side { order:-1; align-items:flex-start; flex-direction:row; gap:24px; align-items:center; }
      .hero-img { width:180px; height:180px; }
      .proj-entry { grid-template-columns:1fr; gap:20px; }
      .skill-row  { grid-template-columns:110px 1fr; }
    }
    @media (max-width: 600px) {
      .nav-links { display:none; }
      :root { --sg:76px; }
      .hero-linkbar { flex-wrap:wrap; }
      .hero-stats   { gap:24px; }
      .hero-stat    { padding-right:24px; margin-right:24px; }
      .contact-row  { flex-direction:column; }
      .clink { border-right:1px solid var(--border); border-bottom:none; border-radius:0; }
      .clink:first-child { border-radius:7px 7px 0 0; }
      .clink:last-child  { border-bottom:1px solid var(--border); border-radius:0 0 7px 7px; }
      footer .container { flex-direction:column; gap:10px; text-align:center; }
    }
  </style>
</head>
<body>
  <div id="portfolio-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ─── TWEAK DEFAULTS ─── */
    const TWEAK_DEFAULTS = {
      "theme": "dark",
      "accentKey": "coral",
      "spacing": "default"
    };

    const ACCENTS = [
      { key:'coral',  val:'oklch(62% 0.18 22)',  hval:'oklch(66% 0.18 22)',  dim:'oklch(62% 0.18 22 / 0.13)',  css:'#C95B45' },
      { key:'amber',  val:'oklch(72% 0.15 72)',  hval:'oklch(76% 0.15 72)',  dim:'oklch(72% 0.15 72 / 0.13)',  css:'#D4A035' },
      { key:'indigo', val:'oklch(60% 0.18 256)', hval:'oklch(64% 0.18 256)', dim:'oklch(60% 0.18 256 / 0.13)', css:'#5566F5' },
      { key:'sage',   val:'oklch(62% 0.15 162)', hval:'oklch(66% 0.15 162)', dim:'oklch(62% 0.15 162 / 0.13)', css:'#2DAF80' },
    ];

    /* ─── DATA ─── */
    const EXPERIENCE = [
      {
        company: "Delta Dental of Michigan",
        role: "Application Developer Intern",
        period: "Nov 2024 – May 2026",
        prose: "Built Spring Boot APIs improving audit capabilities for dental insurance contracts serving 22M+ members. Reduced manual eligibility review time for 100+ analysts by constructing an end-to-end pipeline that ingests enrollment documents from Outlook, routes them through Azure OpenAI and Document Intelligence agents, and surfaces structured outputs via FastAPI. Designed the Angular review UI within Roosevelt Solutions for human-in-the-loop decision-making.",
        tags: ["Spring Boot", "FastAPI", "Azure OpenAI", "Angular", "Java", "JUnit", "Mockito"],
      },
      {
        company: "Michigan State University",
        role: "Student Web Developer",
        period: "Jan 2023 – May 2025",
        prose: "Refactored the MSU Sports Camps platform to Drupal, stabilizing a system used by 2,000+ students that generates over $1M in annual program revenue. Debugged and resolved production issues in the RHS Service Portal — a Symfony application managing residence hall service desk operations across multiple buildings. Built a reusable PHP Drupal Hooks module that auto-generates customized XML event feeds for 10+ campus venues.",
        tags: ["Drupal", "PHP", "Symfony", "MySQL", "JavaScript"],
      },
    ];

    const PROJECTS = [
      {
        name: "Developable",
        sub: "Multi-agent code generation skill built on Claude",
        desc: "A structured Claude skill that coordinates three agents — Developer, Tester, and Version Control — to generate complete, tested Express + TypeScript backends from a schema definition. The Developer agent produces auth-enforced, Zod-validated endpoints; the Tester writes 100+ integration tests per schema; the VC agent handles schema diffing and incremental regeneration. Prompt caching eliminates redundant LLM calls on iterative runs, cutting token consumption by 20%+ per session.",
        tags: ["Python", "TypeScript", "Prisma", "Claude API", "Docker", "Pytest"],
        link: "https://github.com/DevelopableAI",
      },
      {
        name: "ContractOS",
        sub: "Contractor lifecycle workflow engine",
        desc: "Declarative workflow engine for the full contractor lifecycle — requisition to offboarding. Configurable stage templates, an append-only EventLog with deadline triggers, and compliance checkpoints at each gate maintain full auditability for organizations managing concurrent assignments.",
        tags: ["Next.js", "TypeScript", "PostgreSQL", "Prisma"],
      },
    ];

    const SKILLS = {
      "Languages":   ["Java", "TypeScript", "Python", "PHP", "SQL", "JavaScript", "C++"],
      "Frameworks":  ["React", "Angular", "Spring Boot", "FastAPI", "Node.js", "Drupal", "Django"],
      "AI / Data":   ["Azure OpenAI", "Claude API", "TensorFlow", "Scikit-learn", "Pandas", "NumPy"],
      "Cloud / Ops": ["AWS", "Azure", "Docker", "Firebase", "MongoDB", "Argo CD", "Linux"],
    };

    /* ─── HOOK ─── */
    function useReveal() {
      useEffect(() => {
        const obs = new IntersectionObserver(
          (es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add('in'); }),
          { threshold:0.07, rootMargin:'0px 0px -32px 0px' }
        );
        document.querySelectorAll('.reveal').forEach((el) => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    /* ─── NAV ─── */
    function Nav({ active }) {
      const [scrolled, setScrolled] = useState(false);
      const [pct, setPct] = useState(0);
      useEffect(() => {
        const fn = () => {
          setScrolled(window.scrollY > 55);
          const max = document.documentElement.scrollHeight - window.innerHeight;
          setPct(max > 0 ? (window.scrollY / max) * 100 : 0);
        };
        window.addEventListener('scroll', fn, { passive:true });
        return () => window.removeEventListener('scroll', fn);
      }, []);
      return (
        <>
          <div className="scroll-bar" style={{ width:`${pct}%` }} />
          <nav className={scrolled ? 'scrolled' : ''}>
            <a href="#hero" className="nav-logo">AAA</a>
            <ul className="nav-links">
              {[['Work','work'],['Projects','projects'],['Skills','skills'],['Contact','contact']].map(([l,id]) => (
                <li key={id}><a href={`#${id}`} className={active===id?'active':''}>{l}</a></li>
              ))}
              <li>
                <a href="Aditya_Archunan_Anand_resume_one_page.pdf"
                   target="_blank" rel="noreferrer" className="nav-resume">
                  Resume ↗
                </a>
              </li>
            </ul>
          </nav>
        </>
      );
    }

    /* ─── HERO ─── */
    function Hero() {
      return (
        <section id="hero">
          <div className="container">
            <div className="hero-inner">
              <div>
                <p className="hero-label">Software Engineer</p>
                <h1 className="hero-name">Aditya<br />Archunan Anand</h1>
                <p className="hero-tagline">
                  Building AI-powered systems and developer tools — from API design to production deployment at enterprise scale.
                </p>
                <div className="hero-linkbar">
                  <a href="mailto:anandad1@msu.edu" className="hero-lnk hi">Email</a>
                  <a href="https://linkedin.com/in/aanandadi/" target="_blank" rel="noreferrer" className="hero-lnk">LinkedIn ↗</a>
                  <a href="https://github.com/AdityaAA2004" target="_blank" rel="noreferrer" className="hero-lnk">GitHub ↗</a>

    /* ─── SKILLS ─── */

          <div className="container">
            <div className="reveal">
              <h2 className="sec-heading">Tech Stack</h2>

              {Object.entries(SKILLS).map(([grp, items], i) => (

                <a href="Aditya_Archunan_Anand_resume_one_page.pdf" target="_blank" rel="noreferrer" className="clink">Resume ↓</a>

              <span className="ft">© 2026 Aditya Archunan Anand</span>

    /* ─── TWEAKS ─── */
    function TweaksPanel({ visible, onClose, theme, setTheme, accentKey, setAccentByKey, spacing, setSpacing }) {
      return (
        <div className={`tp ${visible ? 'on' : ''}`}>
          <div className="tp-head">
            <span className="tp-title">Tweaks</span>
            <span className="tp-x" onClick={onClose}>✕</span>
          </div>
          <div className="tp-row">
            <p className="tp-lbl">Theme</p>
            <div className="tp-opts">
              <button className={`tp-btn ${theme==='dark'?'on':''}`}  onClick={()=>setTheme('dark')}>Dark</button>
              <button className={`tp-btn ${theme==='light'?'on':''}`} onClick={()=>setTheme('light')}>Light</button>
            </div>
          </div>
          <div className="tp-row">
            <p className="tp-lbl">Accent</p>
            <div className="tp-opts" style={{ justifyContent:'flex-start', gap:'10px' }}>
              {ACCENTS.map((a) => (
                <div key={a.key} className={`swatch ${accentKey===a.key?'on':''}`}
                  style={{ background:a.css }} onClick={()=>setAccentByKey(a.key)} title={a.key} />
              ))}
            </div>
          </div>
          <div className="tp-row">
            <p className="tp-lbl">Spacing</p>
            <div className="tp-opts">
              <button className={`tp-btn ${spacing==='compact'?'on':''}`}  onClick={()=>setSpacing('compact')}>Compact</button>
              <button className={`tp-btn ${spacing==='default'?'on':''}`} onClick={()=>setSpacing('default')}>Spacious</button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── APP ─── */
    function App() {
      const d = TWEAK_DEFAULTS;
      const [theme,     setThemeS]   = useState(d.theme);
      const [accentKey, setAccentKey] = useState(d.accentKey);
      const [spacing,   setSpacingS]  = useState(d.spacing);
      const [tweaks,    setTweaks]    = useState(false);
      const [active,    setActive]    = useState('hero');

      useReveal();

      const setTheme = (v) => {
        setThemeS(v);
        document.documentElement.setAttribute('data-theme', v);
        window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ theme:v } }, '*');
      };

      const setAccentByKey = useCallback((key) => {
        const a = ACCENTS.find((x) => x.key === key);
        if (!a) return;
        setAccentKey(key);
        const r = document.documentElement;
        r.style.setProperty('--accent',     a.val);
        r.style.setProperty('--accent-h',   a.hval);
        r.style.setProperty('--accent-dim', a.dim);
        window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ accentKey:key } }, '*');
      }, []);

      const setSpacing = (v) => {
        setSpacingS(v);
        document.documentElement.style.setProperty('--sg', v==='compact' ? '78px' : '116px');
        window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ spacing:v } }, '*');
      };

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, []);

      useEffect(() => {
        const fn = (e) => {
          if (e.data?.type === '__activate_edit_mode')   setTweaks(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaks(false);
        };
        window.addEventListener('message', fn);
        window.parent.postMessage({ type:'__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', fn);
      }, []);

      useEffect(() => {
        const ids = ['hero','work','projects','skills','contact'];
        const obs = new IntersectionObserver(
          (es) => es.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); }),
          { threshold:0.2 }
        );
        ids.forEach((id) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

      return (
        <>
          <Nav active={active} />
          <Hero />
          <Experience />
          <Projects />
          <Skills />
          <Contact />
          <TweaksPanel
            visible={tweaks}
            onClose={() => { setTweaks(false); window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); }}
            theme={theme}     setTheme={setTheme}
            accentKey={accentKey} setAccentByKey={setAccentByKey}
            spacing={spacing} setSpacing={setSpacing}
          />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('portfolio-root')).render(<App />);
  </script>
</body>
